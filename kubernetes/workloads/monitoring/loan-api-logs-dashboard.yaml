apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-api-logs-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"          # loaded by the Grafana dashboard sidecar
data:
  loan-api-logs.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": ["loan-api", "logs", "mlops"],
      "title": "Loan API - Logs",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "loki_ds",
            "label": "Loki",
            "type": "datasource",
            "query": "loki",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "loan-api logs (application namespace)",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${loki_ds}" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${loki_ds}" },
              "expr": "{namespace=\"application\"}"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Errors across ML namespaces",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "loki", "uid": "${loki_ds}" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "${loki_ds}" },
              "expr": "{namespace=~\"application|kubeflow|mlflow\"} |~ \"(?i)error\""
            }
          ]
        }
      ]
    }
