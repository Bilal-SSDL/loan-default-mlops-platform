apiVersion: v1
kind: ConfigMap
metadata:
  name: loan-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"          # the kube-prometheus-stack Grafana sidecar watches for this label
data:
  loan-api.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "tags": ["loan-api", "mlops"],
      "title": "Loan API - Inference",
      "refresh": "30s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Request rate (/predict)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(http_requests_total{handler=\"/predict\"}[$__rate_interval]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "p95 latency (/predict)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{handler=\"/predict\"}[$__rate_interval])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx error rate (/predict)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(rate(http_requests_total{status=\"5xx\",handler=\"/predict\"}[$__rate_interval]))",
              "legendFormat": "5xx/s"
            }
          ]
        }
      ]
    }
