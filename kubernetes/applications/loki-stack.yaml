apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.2          # pin a current release; verify
    helm:
      values: |
        loki:
          enabled: true
          persistence:
            enabled: true
            size: 10Gi              # filesystem storage on a PVC
        promtail:
          enabled: true             # DaemonSet: tails all pod logs -> Loki
        grafana:
          enabled: false            # you already have Grafana (kube-prometheus-stack)
        prometheus:
          enabled: false            # already have Prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
