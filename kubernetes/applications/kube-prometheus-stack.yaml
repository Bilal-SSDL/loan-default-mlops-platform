apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.1.2          # pin a current release; verify latest
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # scrape ServiceMonitors from ALL namespaces, not just the chart's own
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 7d
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits:   { memory: 1500Mi }
        grafana:
          adminPassword: admin@123        # change me; or leave default prom-operator
        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 50m, memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true          # the stack's CRDs are large
